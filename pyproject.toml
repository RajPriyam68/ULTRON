[project]
name = "ultron"
version = "0.1.0"
description = "ULTRON — Unified Local and Remote Task-Orchestration Network"
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".venv", "venv", "data", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"scripts/**" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]
